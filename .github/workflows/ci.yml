name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-and-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @v2/web build
      - run: pnpm build:analyze
      - run: pnpm test:generated -- --check-migrations
      - run: pnpm guard:architecture
      - name: Upload build analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-analysis-report
          path: reports/
          if-no-files-found: warn
