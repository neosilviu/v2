name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-and-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @v2/web build
      - run: pnpm build:analyze
      - run: pnpm test:generated -- --check-migrations
      - run: pnpm guard:architecture
      - name: Production-like local smoke
        run: |
          pnpm dev > /tmp/v2-dev.log 2>&1 &
          echo $! > /tmp/v2-dev.pid
          for i in {1..60}; do
            if curl -fsS http://localhost:8787/health >/dev/null && curl -fsS http://localhost:8788/health >/dev/null && curl -fsS http://localhost:5173/login >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "${ready:-0}" != "1" ]; then
            cat /tmp/v2-dev.log
            exit 1
          fi
          pnpm smoke:local -- --prepare-auth-db
        shell: bash
      - name: Stop local smoke services
        if: always()
        run: pnpm dev:stop || true
      - name: Upload build analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-analysis-report
          path: reports/
          if-no-files-found: warn
