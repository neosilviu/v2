name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-and-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Run pnpm typecheck
        run: pnpm typecheck 2>&1 | tee /tmp/v2-typecheck.log
        shell: bash
      - name: Upload typecheck output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-output
          path: /tmp/v2-typecheck.log
          if-no-files-found: error
      - run: pnpm --filter @v2/web build
      - run: pnpm build:analyze
      - run: pnpm test:generated -- --check-migrations
      - run: pnpm guard:architecture
      - name: Production-like local smoke
        run: |
          pnpm dev > /tmp/v2-dev.log 2>&1 &
          echo $! > /tmp/v2-dev.pid
          for i in {1..60}; do
            if curl -fsS http://localhost:8787/health >/dev/null && curl -fsS http://localhost:8788/health >/dev/null && curl -fsS http://localhost:5173/login >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "${ready:-0}" != "1" ]; then
            cat /tmp/v2-dev.log
            exit 1
          fi
          pnpm smoke:local -- --prepare-auth-db 2>&1 | tee /tmp/v2-smoke.log
        shell: bash
      - name: Build smoke progress markers
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/v2-smoke-markers
          grep -Fq "[ok] Core session with Better Auth cookie" /tmp/v2-smoke.log && printf ok > /tmp/v2-smoke-markers/core-session || true
          grep -Fq "[ok] Owner setup consumed explicitly" /tmp/v2-smoke.log && printf ok > /tmp/v2-smoke-markers/owner-consumed || true
          [ "$(grep -Fc '[ok] local Auth D1 registration policy opened' /tmp/v2-smoke.log || true)" -ge 2 ] && printf ok > /tmp/v2-smoke-markers/second-policy-write || true
          [ "$(grep -Fc '[ok] Workspace provisioning request created' /tmp/v2-smoke.log || true)" -ge 2 ] && printf ok > /tmp/v2-smoke-markers/second-token || true
          grep -Fq "[ok] Owner setup API creates account with registration disabled" /tmp/v2-smoke.log && printf ok > /tmp/v2-smoke-markers/owner-created || true
          grep -Fq "Owner setup API creates account with registration disabled - HTTP 401" /tmp/v2-smoke.log && printf ok > /tmp/v2-smoke-markers/http-401 || true
          grep -Fq "Owner setup API creates account with registration disabled - HTTP 404" /tmp/v2-smoke.log && printf ok > /tmp/v2-smoke-markers/http-404 || true
          grep -Fq "Owner setup API creates account with registration disabled - HTTP 500" /tmp/v2-smoke.log && printf ok > /tmp/v2-smoke-markers/http-500 || true
          grep -Fq "Owner setup API creates account with registration disabled - HTTP 503" /tmp/v2-smoke.log && printf ok > /tmp/v2-smoke-markers/http-503 || true
      - name: Upload marker core session reached
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marker-core-session-reached
          path: /tmp/v2-smoke-markers/core-session
          if-no-files-found: ignore
      - name: Upload marker owner consumed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marker-owner-consumed
          path: /tmp/v2-smoke-markers/owner-consumed
          if-no-files-found: ignore
      - name: Upload marker second policy write
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marker-second-policy-write
          path: /tmp/v2-smoke-markers/second-policy-write
          if-no-files-found: ignore
      - name: Upload marker second owner token
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marker-second-owner-token
          path: /tmp/v2-smoke-markers/second-token
          if-no-files-found: ignore
      - name: Upload marker owner created
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marker-registration-disabled-owner-created
          path: /tmp/v2-smoke-markers/owner-created
          if-no-files-found: ignore
      - name: Upload marker owner signup http 401
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marker-owner-signup-http-401
          path: /tmp/v2-smoke-markers/http-401
          if-no-files-found: ignore
      - name: Upload marker owner signup http 404
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marker-owner-signup-http-404
          path: /tmp/v2-smoke-markers/http-404
          if-no-files-found: ignore
      - name: Upload marker owner signup http 500
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marker-owner-signup-http-500
          path: /tmp/v2-smoke-markers/http-500
          if-no-files-found: ignore
      - name: Upload marker owner signup http 503
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marker-owner-signup-http-503
          path: /tmp/v2-smoke-markers/http-503
          if-no-files-found: ignore
      - name: Upload local smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-smoke-diagnostics
          path: |
            /tmp/v2-smoke.log
            /tmp/v2-dev.log
          if-no-files-found: warn
      - name: Stop local smoke services
        if: always()
        run: pnpm dev:stop || true
      - name: Upload build analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-analysis-report
          path: reports/
          if-no-files-found: warn
