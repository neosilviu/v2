name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-and-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Run pnpm typecheck
        run: pnpm typecheck 2>&1 | tee /tmp/v2-typecheck.log
        shell: bash
      - name: Upload typecheck output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-output
          path: /tmp/v2-typecheck.log
          if-no-files-found: error
      - run: pnpm --filter @v2/web build
      - run: pnpm build:analyze
      - run: pnpm test:generated -- --check-migrations
      - run: pnpm guard:architecture
      - name: Production-like local smoke
        run: |
          pnpm dev > /tmp/v2-dev.log 2>&1 &
          echo $! > /tmp/v2-dev.pid
          for i in {1..60}; do
            if curl -fsS http://localhost:8787/health >/dev/null && curl -fsS http://localhost:8788/health >/dev/null && curl -fsS http://localhost:5173/login >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "${ready:-0}" != "1" ]; then
            cat /tmp/v2-dev.log
            exit 1
          fi
          pnpm smoke:local -- --prepare-auth-db 2>&1 | tee /tmp/v2-smoke.log
        shell: bash
      - name: Build smoke progress markers
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/v2-smoke-markers
          grep -Fq "[ok] Core session with Better Auth cookie" /tmp/v2-smoke.log && printf ok > /tmp/v2-smoke-markers/core-session || true
          grep -Fq "[ok] Owner setup consumed explicitly" /tmp/v2-smoke.log && printf ok > /tmp/v2-smoke-markers/owner-consumed || true
          [ "$(grep -Fc '[ok] Workspace provisioning request created' /tmp/v2-smoke.log || true)" -ge 2 ] && printf ok > /tmp/v2-smoke-markers/second-token || true
          grep -Fq "[ok] Owner setup API creates account with registration disabled" /tmp/v2-smoke.log && printf ok > /tmp/v2-smoke-markers/owner-created || true
          for code in 400 401 403 404 409 422 429 500 502 503; do
            grep -Fq "Owner setup API creates account with registration disabled - HTTP ${code}" /tmp/v2-smoke.log && printf ok > "/tmp/v2-smoke-markers/http-${code}" || true
          done
      - name: Upload marker core session reached
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: marker-core-session-reached, path: /tmp/v2-smoke-markers/core-session, if-no-files-found: ignore }
      - name: Upload marker owner consumed
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: marker-owner-consumed, path: /tmp/v2-smoke-markers/owner-consumed, if-no-files-found: ignore }
      - name: Upload marker second owner token
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: marker-second-owner-token, path: /tmp/v2-smoke-markers/second-token, if-no-files-found: ignore }
      - name: Upload marker owner created
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: marker-registration-disabled-owner-created, path: /tmp/v2-smoke-markers/owner-created, if-no-files-found: ignore }
      - name: Upload marker owner signup HTTP 400
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: marker-owner-signup-http-400, path: /tmp/v2-smoke-markers/http-400, if-no-files-found: ignore }
      - name: Upload marker owner signup HTTP 401
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: marker-owner-signup-http-401, path: /tmp/v2-smoke-markers/http-401, if-no-files-found: ignore }
      - name: Upload marker owner signup HTTP 403
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: marker-owner-signup-http-403, path: /tmp/v2-smoke-markers/http-403, if-no-files-found: ignore }
      - name: Upload marker owner signup HTTP 404
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: marker-owner-signup-http-404, path: /tmp/v2-smoke-markers/http-404, if-no-files-found: ignore }
      - name: Upload marker owner signup HTTP 409
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: marker-owner-signup-http-409, path: /tmp/v2-smoke-markers/http-409, if-no-files-found: ignore }
      - name: Upload marker owner signup HTTP 422
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: marker-owner-signup-http-422, path: /tmp/v2-smoke-markers/http-422, if-no-files-found: ignore }
      - name: Upload marker owner signup HTTP 429
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: marker-owner-signup-http-429, path: /tmp/v2-smoke-markers/http-429, if-no-files-found: ignore }
      - name: Upload marker owner signup HTTP 500
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: marker-owner-signup-http-500, path: /tmp/v2-smoke-markers/http-500, if-no-files-found: ignore }
      - name: Upload marker owner signup HTTP 502
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: marker-owner-signup-http-502, path: /tmp/v2-smoke-markers/http-502, if-no-files-found: ignore }
      - name: Upload marker owner signup HTTP 503
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: marker-owner-signup-http-503, path: /tmp/v2-smoke-markers/http-503, if-no-files-found: ignore }
      - name: Upload local smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-smoke-diagnostics
          path: |
            /tmp/v2-smoke.log
            /tmp/v2-dev.log
          if-no-files-found: warn
      - name: Stop local smoke services
        if: always()
        run: pnpm dev:stop || true
      - name: Upload build analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: build-analysis-report, path: reports/, if-no-files-found: warn }
